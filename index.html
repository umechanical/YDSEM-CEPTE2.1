important:[['Sleep is important for your health.','Uyku sağlığın için önemlidir.'],['This is an important message.','Bu önemli bir mesaj.'],['Your opinion is important to me.','Fikrin benim için önemli.']],
significant:[['There was a significant rise in prices.','Fiyatlarda kayda değer bir artış oldu.'],['She made significant progress this week.','Bu hafta önemli ilerleme kaydetti.'],['This is a significant change.','Bu önemli bir değişiklik.']],
crucial:[['Water is crucial for life.','Su yaşam için hayati önem taşır.'],['Your help is crucial to our success.','Yardımın başarımız için çok önemli.'],['This is a crucial decision.','Bu çok önemli bir karar.']],
critical:[['Early treatment is critical.','Erken tedavi çok önemlidir.'],['This is a critical moment.','Bu kritik bir an.'],['Food supplies are critical after a disaster.','Afet sonrasında yiyecek tedariki çok önemlidir.']],
vital:[['Clean air is vital for health.','Temiz hava sağlık için hayati önem taşır.'],['The doctor checked his vital organs.','Doktor onun hayati organlarını kontrol etti.'],['This information is vital to us.','Bu bilgi bizim için hayati önem taşıyor.']],
necessary:[['A ticket is necessary to enter.','Girmek için bilet gereklidir.'],['Is this change necessary?','Bu değişiklik gerekli mi?'],['Bring only the necessary tools.','Yalnızca gerekli aletleri getir.']],
essential:[['Water is essential for plants.','Su bitkiler için gereklidir.'],['Please pack the essential items.','Lütfen temel eşyaları hazırla.'],['Good sleep is essential for learning.','İyi uyku öğrenmek için gereklidir.']],
fundamental:[['Trust is a fundamental part of friendship.','Güven arkadaşlığın temel bir parçasıdır.'],['We learned the fundamental rules.','Temel kuralları öğrendik.'],['The plan has a fundamental problem.','Planın temel bir sorunu var.']],
required:[['A password is required here.','Burada şifre gereklidir.'],['She brought the required documents.','Gerekli belgeleri getirdi.'],['No experience is required for this job.','Bu iş için deneyim gerekli değildir.']],
needed:[['More time is needed.','Daha fazla zamana ihtiyaç var.'],['Help is needed in the kitchen.','Mutfakta yardıma ihtiyaç var.'],['These are the tools needed for the job.','Bunlar iş için gereken aletler.']],
strange:[['I heard a strange sound.','Tuhaf bir ses duydum.'],['This fruit has a strange taste.','Bu meyvenin tuhaf bir tadı var.'],['His answer was strange.','Cevabı tuhaftı.']],
unusual:[['Snow is unusual here in May.','Mayısta burada kar alışılmadık bir durumdur.'],['She has an unusual name.','Alışılmadık bir adı var.'],['We saw an unusual bird.','Alışılmadık bir kuş gördük.']],
weird:[['That was a weird dream.','Bu garip bir rüyaydı.'],['The machine makes a weird noise.','Makine garip bir ses çıkarıyor.'],['This soup tastes weird.','Bu çorbanın tadı garip.']],
uncommon:[['This flower is uncommon here.','Bu çiçek burada yaygın değildir.'],['Such mistakes are uncommon.','Bu tür hatalar yaygın değildir.'],['She found an uncommon coin.','Nadir bulunan bir madeni para buldu.']],
massive:[['A massive rock blocked the road.','Devasa bir kaya yolu kapattı.'],['The storm caused massive damage.','Fırtına çok büyük hasara yol açtı.'],['They built a massive bridge.','Devasa bir köprü yaptılar.']],
huge:[['They live in a huge house.','Kocaman bir evde yaşıyorlar.'],['A huge crowd waited outside.','Dışarıda büyük bir kalabalık bekliyordu.'],['This bag is huge.','Bu çanta kocaman.']],
vast:[['The desert covers a vast area.','Çöl çok geniş bir alanı kaplar.'],['The ocean is vast.','Okyanus uçsuz bucaksızdır.'],['She has a vast collection of books.','Çok geniş bir kitap koleksiyonu var.']],
immense:[['The ship is immense.','Gemi muazzam büyüklükte.'],['He felt immense joy.','Çok büyük mutluluk duydu.'],['The work needs immense effort.','Bu iş muazzam çaba gerektiriyor.']],
enormous:[['An enormous tree stood in the garden.','Bahçede çok büyük bir ağaç vardı.'],['The project has an enormous cost.','Projenin çok büyük bir maliyeti var.'],['They ate an enormous meal.','Çok büyük bir öğün yediler.']],
compulsory:[['School is compulsory for children.','Okul çocuklar için zorunludur.'],['This course is compulsory.','Bu ders zorunludur.'],['Wearing a seat belt is compulsory.','Emniyet kemeri takmak zorunludur.']],
mandatory:[['A helmet is mandatory here.','Burada kask zorunludur.'],['Attendance is mandatory today.','Bugün katılım zorunludur.'],['The workers took mandatory training.','İşçiler zorunlu eğitim aldı.']],
obligatory:[['Payment is obligatory before entry.','Girişten önce ödeme zorunludur.'],['This test is obligatory for all students.','Bu test bütün öğrenciler için zorunludur.'],['A uniform is obligatory at this school.','Bu okulda üniforma zorunludur.']],
enforced:[['The enforced rules kept everyone safe.','Uygulanan kurallar herkesi güvende tuttu.'],['The rule is strictly enforced.','Kural sıkı biçimde uygulanıyor.'],['An enforced break stopped the work.','Zorunlu bir ara çalışmayı durdurdu.']],
sudden:[['A sudden noise woke me.','Ani bir ses beni uyandırdı.'],['There was a sudden change in weather.','Havada ani bir değişiklik oldu.'],['She felt a sudden pain.','Ani bir ağrı hissetti.']],
abrupt:[['The bus made an abrupt stop.','Otobüs aniden durdu.'],['The meeting came to an abrupt end.','Toplantı aniden sona erdi.'],['There was an abrupt change in the plan.','Planda ani bir değişiklik oldu.']],
hasty:[['Do not make a hasty decision.','Aceleci bir karar verme.'],['He gave a hasty answer.','Aceleyle bir cevap verdi.'],['A hasty repair did not solve the problem.','Aceleyle yapılan tamir sorunu çözmedi.']],
urgent:[['I need urgent help.','Acil yardıma ihtiyacım var.'],['This is an urgent message.','Bu acil bir mesaj.'],['The roof needs urgent repairs.','Çatının acilen tamir edilmesi gerekiyor.']],
immediate:[['The patient needs immediate care.','Hastanın hemen bakıma ihtiyacı var.'],['We need an immediate answer.','Hemen bir cevaba ihtiyacımız var.'],['The medicine had an immediate effect.','İlaç hemen etki gösterdi.']],
close:[['The school is close to my home.','Okul evime yakın.'],['Stay close to me.','Bana yakın dur.'],['The two houses are close together.','İki ev birbirine yakın.']],
approaching:[['We could see an approaching bus.','Yaklaşan bir otobüs görebiliyorduk.'],['The approaching storm looked dangerous.','Yaklaşan fırtına tehlikeli görünüyordu.'],['The exam date is approaching.','Sınav tarihi yaklaşıyor.']],
near:[['The shop is near the park.','Dükkân parkın yakınında.'],['Sit near the window.','Pencerenin yakınına otur.'],['We live near the sea.','Denizin yakınında yaşıyoruz.']],
steady:[['She made steady progress.','İstikrarlı ilerleme kaydetti.'],['The car moved at a steady speed.','Araba sabit hızla ilerledi.'],['He has a steady income.','Düzenli bir geliri var.']],
stable:[['The patient is stable now.','Hastanın durumu şimdi dengeli.'],['Prices remained stable this month.','Fiyatlar bu ay sabit kaldı.'],['The table is stable on this floor.','Masa bu zeminde dengede duruyor.']],
fixed:[['The ticket has a fixed price.','Biletin sabit bir fiyatı var.'],['We have a fixed meeting time.','Sabit bir toplantı saatimiz var.'],['The camera stays in a fixed position.','Kamera sabit bir konumda duruyor.']],
constant:[['The constant noise kept me awake.','Sürekli gürültü beni uyanık tuttu.'],['Keep the temperature constant.','Sıcaklığı sabit tut.'],['The baby needs constant care.','Bebeğin sürekli bakıma ihtiyacı var.']],
persistent:[['He has a persistent cough.','Geçmeyen bir öksürüğü var.'],['Persistent rain delayed the game.','Sürekli yağmur oyunu geciktirdi.'],['Her persistent efforts finally worked.','Onun ısrarlı çabaları sonunda işe yaradı.']],
consistent:[['Her answers are consistent.','Cevapları tutarlı.'],['The team needs consistent results.','Ekibin tutarlı sonuçlara ihtiyacı var.'],['His story is consistent with the facts.','Onun anlatımı gerçeklerle tutarlı.']],
abundant:[['Fish are abundant in this lake.','Bu gölde balık boldur.'],['The garden has abundant flowers.','Bahçede bol çiçek var.'],['Fresh water is abundant here.','Burada tatlı su boldur.']],
numerous:[['We received numerous messages.','Çok sayıda mesaj aldık.'],['She has numerous books.','Çok sayıda kitabı var.'],['Numerous people came to the concert.','Konsere çok sayıda insan geldi.']],
plentiful:[['Food was plentiful at the party.','Partide yiyecek boldu.'],['Jobs are plentiful in this city.','Bu şehirde iş boldur.'],['Rain is plentiful in spring.','İlkbaharda yağmur boldur.']],
ample:[['We have ample time to finish.','Bitirmek için fazlasıyla zamanımız var.'],['There is ample room for everyone.','Herkese yetecek kadar bol yer var.'],['The police found ample evidence.','Polis bol kanıt buldu.']],
considerable:[['The work takes considerable time.','İş hatırı sayılır zaman alıyor.'],['She made considerable progress.','Kayda değer ilerleme kaydetti.'],['The car needs considerable repair.','Arabanın önemli ölçüde tamire ihtiyacı var.']],

const KEY='ydsem-progress-v1';const DAY=86400000;const today=()=>new Date().toISOString().slice(0,10);
function blank(){return {schema:1,words:{},exams:{},xp:0,xpAwards:{},days:{},studyMinutes:{},activity:[],settings:{weeklyGoal:5},created:today()}}
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));return p&&p.schema===1?{...blank(),...p,studyMinutes:p.studyMinutes||{}}:blank()}catch{return blank()}}
let saveHook=null;function setSaveHook(fn){saveHook=fn}
let state=load();function save(){localStorage.setItem(KEY,JSON.stringify(state));if(saveHook)saveHook()}
function wordState(id){return state.words[id]||{level:0,correct:0,wrong:0,streak:0,difficulty:2,last:null,due:today()}}
function award(key,points){if(state.xpAwards[key])return;state.xpAwards[key]=1;state.xp+=points;save()}
function record(id,good,kind='question'){const w=wordState(id),now=today();w.last=now;w.updatedAt=Date.now();w.correct+=good?1:0;w.wrong+=good?0:1;w.streak=good?w.streak+1:0;w.level=good?Math.min(5,w.level+1):Math.max(0,w.level-1);w.difficulty=Math.max(1,Math.min(5,w.difficulty+(good?-.15:.4)));const intervals=[0,1,3,7,14,30];let days=good?intervals[w.level]:0;if(good&&w.streak>=3)days=Math.ceil(days*1.3);if(WORDS.find(x=>x.id===id)?.star)days=Math.max(0,Math.ceil(days*.8));w.due=new Date(Date.now()+days*DAY).toISOString().slice(0,10);state.words[id]=w;state.days[now]=(state.days[now]||0)+1;state.activity.push({eventId:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`,date:now,id,good,kind});save();if(good)award(`correct:${kind}:${id}:${now}`,5)}
function markLearned(id,choice){const w=wordState(id);if(!w.introduced){w.introduced=today();state.words[id]=w;award(`learn:${id}`,10)}record(id,choice==='know','card')}
function dueWords(){const now=today();return WORDS.filter(w=>wordState(w.id).introduced&&wordState(w.id).due<=now).sort((a,b)=>Number(b.star)-Number(a.star))}
function examResult(key,score,total){const percent=Math.round(score/total*100);const prev=state.exams[key];state.exams[key]={best:Math.max(percent,prev?.best||0),latest:percent,date:today()};save();if(percent>=80)award(`pass:${key}`,key==='big'?250:key.startsWith('progress')?100:key.startsWith('set')?50:25);return percent}
function exportProgress(){return JSON.stringify(state,null,2)}
function importProgress(raw){const p=JSON.parse(raw);if(p?.schema!==1||typeof p.words!=='object'||typeof p.exams!=='object'||typeof p.xp!=='number')throw Error('Geçersiz yedek dosyası');state={...blank(),...p};save()}
function resetProgress(){state=blank();save()}
function streak(){let d=new Date(),n=0;while(true){const k=d.toISOString().slice(0,10);if(!state.days[k]){if(n===0){d.setDate(d.getDate()-1);if(!state.days[d.toISOString().slice(0,10)])break}else break}else{n++;d.setDate(d.getDate()-1)}}return n}
function addStudyMinute(){const k=today();state.studyMinutes[k]=(state.studyMinutes[k]||0)+1;save()}

let account=null;let syncStatus='Yerel kayıt';let revision=0,busy=false,dirty=false,silent=false,timer=null;
const online=()=>location.protocol==='http:'||location.protocol==='https:';
async function api(path,method='GET',body){const res=await fetch('/api/'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});const data=await res.json().catch(()=>({error:'Sunucu yanıtı okunamadı.'}));if(!res.ok){const err=new Error(data.error||`Sunucu hatası (${res.status})`);err.status=res.status;err.data=data;throw err}return data}
function merge(a,b){
  if(!a)return b;if(!b)return a;
  const p={...a,...b,words:{...a.words},exams:{...a.exams},xpAwards:{...a.xpAwards,...b.xpAwards},days:{},studyMinutes:{...a.studyMinutes},activity:[]};
  for(const [id,w] of Object.entries(b.words||{})){const old=p.words[id];p.words[id]=!old?w:(w.updatedAt||0)>(old.updatedAt||0)?{...old,...w}:{...w,...old}}
  for(const [id,x] of Object.entries(b.exams||{})){const old=p.exams[id];p.exams[id]=!old?x:{...(x.date>=old.date?x:old),best:Math.max(x.best||0,old.best||0)}}
  for(const [k,v] of Object.entries(b.studyMinutes||{}))p.studyMinutes[k]=Math.max(p.studyMinutes[k]||0,v);
  const seen=new Set();for(const item of [...(a.activity||[]),...(b.activity||[])]){const key=item.eventId||JSON.stringify(item);if(!seen.has(key)){seen.add(key);p.activity.push(item)}}
  const counters={};for(const item of p.activity){const c=counters[item.id]||(counters[item.id]={correct:0,wrong:0});c[item.good?'correct':'wrong']++}
  for(const [id,c] of Object.entries(counters))if(p.words[id]){p.words[id].correct=Math.max(p.words[id].correct||0,c.correct);p.words[id].wrong=Math.max(p.words[id].wrong||0,c.wrong)}
  for(const item of p.activity)p.days[item.date]=(p.days[item.date]||0)+1;
  for(const source of [a.days||{},b.days||{}])for(const [day,count] of Object.entries(source))p.days[day]=Math.max(p.days[day]||0,count);
  const points=Object.keys(p.xpAwards).reduce((sum,key)=>sum+(key.startsWith('learn:')?10:key.startsWith('correct:')?5:key.startsWith('pass:big')?250:key.startsWith('pass:progress')?100:key.startsWith('pass:set')?50:25),0);
  p.xp=Math.max(a.xp||0,b.xp||0,points);return p
}
function replaceProgress(p){silent=true;try{importProgress(JSON.stringify(p))}finally{silent=false}}
function schedule(){if(silent||!account)return;dirty=true;clearTimeout(timer);timer=setTimeout(flush,700)}
setSaveHook(schedule);
async function flush(){if(busy||!dirty||!account)return;busy=true;dirty=false;const snapshot=JSON.parse(exportProgress());try{const result=await api('progress','PUT',{progress:snapshot,revision});revision=result.revision;syncStatus='Eşitlendi'}catch(err){if(err.status===409&&err.data?.progress){revision=err.data.revision;replaceProgress(merge(snapshot,err.data.progress));dirty=true;syncStatus='Çakışma birleştirildi'}else{dirty=true;syncStatus='Bağlantı bekleniyor'}}finally{busy=false;if(dirty&&account){clearTimeout(timer);timer=setTimeout(flush,3000)}}}
async function acceptSession(data){account=data.username;revision=data.revision||0;const owner=localStorage.getItem('ydsem-account-owner'),local=JSON.parse(exportProgress());if(owner&&owner!==account){silent=true;resetProgress();silent=false;if(data.progress)replaceProgress(data.progress)}else if(data.progress)replaceProgress(merge(local,data.progress));localStorage.setItem('ydsem-account-owner',account);syncStatus='Eşitleniyor';dirty=true;await flush()}
async function initSync(){if(!online())return;try{const data=await api('session');if(data.username)await acceptSession(data);else syncStatus='Hesap bağlı değil'}catch{syncStatus='Eşitleme sunucusu yok'}setInterval(async()=>{if(!account||document.visibilityState==='hidden')return;try{await flush();const data=await api('session');if(data.revision>revision){revision=data.revision;replaceProgress(merge(JSON.parse(exportProgress()),data.progress));syncStatus='Eşitlendi'}}catch{syncStatus='Bağlantı bekleniyor'}},30000)}
async function register(username,password){const data=await api('register','POST',{username,password});await acceptSession(data)}
async function login(username,password){const data=await api('login','POST',{username,password});await acceptSession(data)}
async function logout(){await flush();await api('logout','POST',{});account=null;revision=0;silent=true;resetProgress();silent=false;localStorage.removeItem('ydsem-account-owner');syncStatus='Yerel kayıt'}

  2:{word:'essential',meaning:'gerekli',synonyms:['necessary','required','needed'],wrong:['vast','weird','sudden']},

  5:{word:'steady',meaning:'istikrarlı',synonyms:['stable','consistent'],wrong:['huge','urgent','weird']},
  6:{word:'abundant',meaning:'bol',synonyms:['plentiful','ample'],wrong:['sudden','mandatory','strange']},

function shufflePractice(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function buildPractice(set){
  const words=WORDS.filter(w=>w.set===set),group=PRACTICE_GROUPS[set],tasks=[];
  for(let i=0;i<words.length;i+=3){const batch=words.slice(i,i+3);tasks.push({type:'match-definition',words:batch,bank:shufflePractice(batch.map(w=>w.en))})}
  tasks.push({type:'synonyms',word:group.word,correct:group.synonyms,options:shufflePractice([...group.synonyms,...group.wrong])});
  const questions=QUESTIONS.filter(q=>q.set===set);
  words.forEach((w,i)=>{tasks.push({type:'type',word:w});if(questions[i])tasks.push({type:'cloze',question:questions[i],options:shufflePractice(questions[i].options)})});
  // A set with four words still has its fifth sentence question.
  questions.slice(words.length).forEach(q=>tasks.push({type:'cloze',question:q,options:shufflePractice(q.options)}));
  tasks.push({type:'odd',word:group.word,meaning:group.meaning,answer:group.wrong[0],options:shufflePractice([group.word,...group.synonyms.slice(0,2),group.wrong[0]])});
  for(let i=0;i<words.length;i+=3){const batch=words.slice(i,i+3);tasks.push({type:'match-sentence',words:batch,bank:shufflePractice(batch.map(w=>w.en))})}
  return tasks;
}
function gradePractice(task,response){
  if(task.type.startsWith('match-'))return task.words.map(w=>({word:w,good:response[w.id]===w.en}));
  if(task.type==='type')return [{word:task.word,good:String(response||'').trim().toLowerCase()===task.word.en}];
  if(task.type==='synonyms')return [{word:WORDS.find(w=>w.en===task.word),good:Array.isArray(response)&&response.length===task.correct.length&&task.correct.every(x=>response.includes(x))}];
  if(task.type==='odd')return [{word:WORDS.find(w=>w.en===task.word),good:response===task.answer}];
  return [{word:WORDS.find(w=>w.en===task.question.answer),good:response===task.question.answer}];
}
const safePractice=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankPractice=(sentence,word)=>sentence.replace(new RegExp('\\b'+word+'\\b','i'),'_____');
function createPractice(set,{render,onFinish}){
  const tasks=buildPractice(set);let index=0,score=0,total=0,response={},selectedSlot=null,checked=false,results=[];
  function current(){return tasks[index]}
  function reset(){const t=current();response=t.type.startsWith('match-')?{}:t.type==='synonyms'?[]:'';selectedSlot=t.words?.[0]?.id||null;checked=false;results=[]}
  function ready(){const t=current();if(t.type.startsWith('match-'))return t.words.every(w=>response[w.id]);if(t.type==='synonyms')return response.length===t.correct.length;return String(response).trim().length>0}
  function view(){
    const t=current(),labels={'match-definition':'Tanımı eşleştir',synonyms:'Eş anlamlıları bul',type:'Kelimeyi yaz',cloze:'Cümleyi tamamla',odd:'Farklı olanı bul','match-sentence':'Kelimeleri yerleştir'};
    let body='',bank='';
    if(t.type.startsWith('match-')){
      body=`<p class="practice-help">Önce bir boşluğa, sonra alttaki kelimeye dokun. Yakın anlamlıları ayırmak için baş harf ipucunu kullan.</p><div class="match-rows">${t.words.map(w=>`<button data-practice-slot="${w.id}" class="match-row ${selectedSlot===w.id?'selected':''}" ${checked?'disabled':''}><small>${w.en.slice(0,3)}… · ${w.en.length} harf</small><span>${t.type==='match-definition'?safePractice(w.definition):safePractice(blankPractice(w.examples[2].en,w.en))}</span><b>${response[w.id]||'Kelime seç'}</b></button>`).join('')}</div>`;
      bank=`<div class="word-bank">${t.bank.map(x=>`<button data-practice-word="${x}" ${checked?'disabled':''} class="${Object.values(response).includes(x)?'used':''}">${x}</button>`).join('')}</div>`;
    }else if(t.type==='type'){
      body=`<h2>${safePractice(t.word.tr)}</h2><p>${safePractice(t.word.definition)}</p><p class="letter-hint">${t.word.en.slice(0,3)}${' _'.repeat(t.word.en.length-3)}</p><label for="practice-answer">İngilizce kelimeyi yaz</label><input id="practice-answer" value="${safePractice(response)}" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" ${checked?'disabled':''}><small class="practice-help">İlk üç harf bu turda hangi kelimeyi aradığımızı gösterir.</small>`;
    }else{
      const text=t.type==='synonyms'?`<mark>${t.word}</mark> için ${t.correct.length} eş anlamlı seç.`:t.type==='odd'?`Hangisi “${t.meaning}” anlam grubuna uymaz?`:safePractice(t.question.prompt);
      body=`<h2>${text}</h2>${t.type==='cloze'?`<p class="practice-help">Anlam ipucu: ${t.question.hint}</p>`:''}${t.type==='synonyms'?`<p class="practice-help">${response.length} / ${t.correct.length} seçildi</p>`:''}<div class="practice-options">${t.options.map(x=>`<button data-practice-option="${x}" class="${(Array.isArray(response)?response.includes(x):response===x)?'selected':''}" ${checked?'disabled':''}>${x}</button>`).join('')}</div>`;
    }
    if(checked){const answer=t.type==='synonyms'?t.correct.join(' · '):t.type==='odd'?`${t.answer} bu gruba uymaz.`:'';body+=`<div class="practice-feedback" role="status"><b>${results.every(x=>x.good)?'Doğru, devam edelim.':'Cevabı birlikte hatırlayalım.'}</b>${answer?`<p>${answer}</p>`:''}${results.map(({word,good})=>`<p>${good?'✓':'↻'} <strong>${word.en}</strong> — ${word.tr}<small>${safePractice(word.examples[1].en)}<br>${safePractice(word.examples[1].tr)}</small></p>`).join('')}</div>`}
    render(`<section class="practice-screen"><div class="practice-top"><span>SET ${set} · ${index+1}/${tasks.length}</span><button data-nav="learn" aria-label="Çalışmadan çık">✕</button></div><div class="progress"><i style="width:${(index+1)/tasks.length*100}%"></i></div><div class="practice-content"><span class="eyebrow">${labels[t.type]}</span>${body}</div><footer class="practice-footer">${checked?'':bank}<button class="primary" data-practice-action="${checked?'next':'check'}" ${!checked&&!ready()?'disabled':''}>${checked?(index===tasks.length-1?'Sonucu gör':'Devam →'):'Kontrol et'}</button></footer></section>`);
  }
  function handle(data){const t=current();if(checked&&data.practiceAction!=='next')return;
    if(data.practiceSlot){selectedSlot=data.practiceSlot;view();return}
    if(data.practiceWord){if(!selectedSlot)return;for(const k of Object.keys(response))if(response[k]===data.practiceWord)delete response[k];response[selectedSlot]=data.practiceWord;selectedSlot=t.words.find(w=>!response[w.id])?.id||selectedSlot;view();return}
    if(data.practiceOption){if(t.type==='synonyms'){response=response.includes(data.practiceOption)?response.filter(x=>x!==data.practiceOption):response.length<t.correct.length?[...response,data.practiceOption]:response}else response=data.practiceOption;view();return}
    if(data.practiceAction==='check'&&ready()){results=gradePractice(t,response);results.forEach(({word,good})=>{record(word.id,good,'set-practice');score+=Number(good);total++});checked=true;view();return}
    if(data.practiceAction==='next'&&checked){index++;if(index===tasks.length){const percent=examResult('set'+set,score,total);onFinish({percent,score,total,set});return}reset();view()}
  }
  function input(value){if(current().type!=='type'||checked)return;response=value;const button=document.querySelector('[data-practice-action="check"]');if(button)button.disabled=!ready()}
  reset();view();return {handle,input};
}

function home(){const m=metrics(),due=dueWords().length; shell(`${title('GÜNLÜK PANEL','Bugün biraz daha güçlen.','Her doğru hatırlama, sınavdaki bir soruyu kolaylaştırır.')}<div class="hero"><div><span class="pill">1. hafta · Adjective Set 1</span><h2>Kelimeler zihninde<br><strong>yerini bulsun.</strong></h2><p>Yıldızlı kelimeler öncelikli. Aynı kelimeyi yeni bağlamlarda tekrar gör.</p><button class="primary" data-nav="learn">Öğrenmeye devam et →</button></div><div class="hero-orb">${m.learned}<small>öğrenilen</small></div></div><div class="metric-grid">${[['Kelime',WORDS.length],['Öğrenilen',m.learned],['Kalıcı',m.mastered],['Bugün tekrar',due],['Tamamlanan set',m.done],['Başarı',m.accuracy+'%'],['Seri',streak()+' gün'],['XP',state.xp]].map(([a,b])=>`<div class="metric"><b>${b}</b><span>${a}</span></div>`).join('')}</div><div class="two"><section class="panel"><h3>Bugünün odağı</h3><p>${due?`${due} kelime tekrar için hazır.`:'Öğrenme kartlarına başlayarak tekrar kuyruğunu oluştur.'}</p><button class="secondary" data-nav="review">Tekrara git →</button></section><section class="panel"><h3>Kurs notları</h3><p>Sıfat eş anlamlıları, edatlar ve çeviri ipuçları ilk gün malzemesi olarak işlendi. Fotoğrafta yıldızı belirsiz işaretler onay bekler.</p><button class="secondary" data-nav="profile">İçeriği incele →</button></section></div>`)}
function setAvailable(n){if(n===1)return true;const prior=n%2===0?'set'+(n-1):n===3?'quiz1':n===5?'progress1':'quiz3';return (state.exams[prior]?.best||0)>=80}
function learn(){shell(`${title('ÖĞRENME YOLU','Setler','Bir sonraki aşama için her set değerlendirmesinde en az %80 başarı gerekir.')}<div class="path">${Array.from({length:8},(_,i)=>{const n=i+1,count=WORDS.filter(w=>w.set===n).length,best=state.exams['set'+n]?.best,open=setAvailable(n);return `<button class="set-card ${open?'':'locked'}" data-set="${n}" ${open?'':'disabled'}><span class="set-no">${String(n).padStart(2,'0')}</span><span><b>Set ${n}</b><small>${count} kelime · ${best===undefined?'Değerlendirilmedi':`En iyi ${best}%`}</small></span><span>${best>=80?'✓':open?'→':'🔒'}</span></button>`}).join('')}</div>`)}

function examDefs(){return [...Array.from({length:8},(_,i)=>{const n=i+1;return {key:'set'+n,name:`Set ${n} Değerlendirmesi`,n:5,requires:n===1?null:n%2===0?'set'+(n-1):n===3?'quiz1':n===5?'progress1':'quiz3',source:[n]}}),...Array.from({length:4},(_,i)=>({key:'quiz'+(i+1),name:`Quiz ${i+1}`,n:10,requires:'set'+((i+1)*2),source:[i*2+1,i*2+2]})),{key:'progress1',name:'Progress Test 1',n:20,requires:'quiz2',source:[1,2,3,4]},{key:'progress2',name:'Progress Test 2',n:40,requires:'quiz4',source:[1,2,3,4,5,6,7,8]},{key:'big',name:'Big Exam',n:40,requires:'progress2',source:[1,2,3,4,5,6,7,8]}]}

function exams(){shell(`${title('SINAV MERKEZİ','Bilgini ölç','Setlerde karışık etkinlikler; quiz ve sınavlarda kısa cümle soruları var.')}<div class="exam-grid">${examDefs().map(d=>`<button class="exam-card" data-exam="${d.key}" ${isOpen(d)?'':'disabled'}><span>${isOpen(d)?'◈':'🔒'}</span><b>${d.name}</b><small>${d.key.startsWith('set')?buildPractice(Number(d.key.slice(3))).length+' etkinlik':d.n+' soru'} · ${state.exams[d.key]?.best===undefined?'Henüz çözülmedi':`En iyi ${state.exams[d.key].best}%`}</small></button>`).join('')}</div>`)}
function startExam(key,choiceOnly=false){const d=examDefs().find(x=>x.key===key);if(!d||!isOpen(d))return;if(key.startsWith('set')&&!choiceOnly){screen='practice';practiceSession=createPractice(Number(key.slice(3)),{render:shell,onFinish:({percent,score,total,set})=>{screen='learn';shell(`${title('SET ÇALIŞMASI',`${percent}% başarı`,`${score} / ${total} doğru. ${percent>=80?'Set tamamlandı.':'%80 için yeniden çalışabilirsin.'}`)}<section class="panel"><p>Kelimeleri tanım, eş anlam, yazma ve cümle içinde tekrar gördün.</p><button class="primary" data-nav="learn">Setlere dön →</button><button class="secondary" data-exam="set${set}">Bir tur daha</button></section>`)}});return}const pool=QUESTIONS.filter(q=>d.source.includes(q.set));session={key,title:d.name,questions:rand(pool).slice(0,d.n).map(q=>({...q,shuffled:rand(q.options)})),index:0,score:0,chosen:null};screen='quiz';quiz()}

function games(){shell(`${title('MİNİ OYUNLAR','Oynayarak hatırla','Her oyun farklı bir hatırlama yolu kullanır.')}<div class="game-grid">${[['syn','Eş Anlamlı Avı','Birden fazla doğru eş anlamlıyı bul.'],['memory','Hafıza Kartları','İngilizce ve Türkçe çiftleri eşleştir.'],['sentence','Cümle Tamamlama','YDS bağlamında doğru kelimeyi seç.'],['recall','Kelimeyi Hatırla','İngilizce kelimeyi kendin yaz.'],['speed','Hızlı Cevap','İsteğe bağlı süre ile seri sorular.']].map(([id,name,desc])=>`<button class="game-card" data-game="${id}"><span>✦</span><b>${name}</b><small>${desc}</small></button>`).join('')}</div>`)}
function startGame(id){game={id,round:0,score:0,selected:[],pairs:[],flipped:[],matched:[],timer:null};screen='game';if(id==='sentence'){startExam('set1',true);session.key='game:sentence';session.title='Cümle Tamamlama';quiz();return}if(id==='speed'){game.limit=0}gameView()}

function synonymGame(){const w=WORDS.filter(x=>x.synonyms.length>=2)[game.round%WORDS.filter(x=>x.synonyms.length>=2).length],correct=w.synonyms.slice(0,2),wrong=WORDS.filter(x=>x.group!==w.group).slice(game.round*2,game.round*2+3).map(x=>x.en),opts=rand([...correct,...wrong]);game.current={w,correct,opts};shell(`${title('EŞ ANLAMLI AVI',w.en,'Tam 2 doğru eş anlamlı seç.')}<div class="options">${opts.map(x=>`<button data-syn="${x}" class="${game.selected.includes(x)?'selected':''}">${x}</button>`).join('')}</div><button class="primary" data-action="check-syn" ${game.selected.length===2?'':'disabled'}>Kontrol et</button><p class="muted">Tur ${game.round+1}/5</p>`)}

function recallGame(){const w=WORDS[(game.round*7+2)%WORDS.length];game.current=w;shell(`${title('KELİMEYİ HATIRLA',w.tr,`İpucu: ${w.definition}`)}<section class="panel"><label for="recall">İngilizce kelime</label><input id="recall" autocomplete="off" spellcheck="false" placeholder="Cevabını yaz"><button class="primary" data-action="check-recall">Kontrol et</button><div id="feedback"></div></section><p class="muted">Tur ${game.round+1}/5</p>`)}
function speedGame(){const w=WORDS[(game.round*11+4)%WORDS.length];game.current=w;game.options=rand([w,...WORDS.filter(x=>x.group!==w.group).slice(game.round*3,game.round*3+3)]);shell(`${title('HIZLI CEVAP',w.tr,'Doğru İngilizce kelimeyi seç.')}<div class="options">${game.options.map(o=>`<button data-speed="${o.en}">${o.en}</button>`).join('')}</div><p class="muted">Tur ${game.round+1}/10 · ${game.score} doğru</p><label class="toggle"><input type="checkbox" id="timed" ${game.limit?'checked':''}> 15 saniyelik süreli mod</label>`);if(game.limit)game.timer=setTimeout(()=>{if(screen==='game'&&game.id==='speed'){record(game.current.id,false,'speed');gameNext(10)}},15000)}
function gameNext(max){if(game.timer)clearTimeout(game.timer);game.timer=null;game.round++;game.selected=[];if(game.round>=max){shell(`${title('OYUN BİTTİ',`${game.score} / ${max}`,'Tekrar denemek hatırlamayı güçlendirir.')}<button class="primary" data-nav="games">Oyunlara dön</button>`);return}gameView()}
function stats(){const m=metrics(),worst=WORDS.map(w=>({w,s:wordState(w.id)})).filter(x=>x.s.wrong).sort((a,b)=>b.s.wrong-a.s.wrong).slice(0,6),days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=d.toISOString().slice(0,10);return {k,n:state.days[k]||0}});shell(`${title('İLERLEME','İstatistikler','Gelişimini kelime ve sınav düzeyinde izle.')}<div class="metric-grid">${[['Toplam kelime',WORDS.length],['Öğrenilen',m.learned],['Kalıcı',m.mastered],['Başarı',m.accuracy+'%'],['XP',state.xp],['Haftalık süre',Object.entries(state.studyMinutes||{}).filter(([k])=>days.some(d=>d.k===k)).reduce((n,[,v])=>n+v,0)+' dk']].map(([a,b])=>`<div class="metric"><b>${b}</b><span>${a}</span></div>`).join('')}</div><div class="two"><section class="panel"><h3>Son 7 gün etkinliği</h3><div class="bars">${days.map(x=>`<div title="${x.k}: ${x.n} etkinlik"><i style="height:${Math.max(6,Math.min(100,x.n*12))}%"></i><small>${x.k.slice(5)}</small></div>`).join('')}</div></section><section class="panel"><h3>En çok hata yapılanlar</h3>${worst.length?worst.map(x=>`<div class="listline"><b>${x.w.en}</b><span>${x.s.wrong} hata</span></div>`).join(''):'Henüz hata kaydı yok.'}</section></div><section class="panel"><h3>Başarı rozetleri</h3><div class="badge-row">${[["İlk adım",m.learned>=1],["10 kelime",m.learned>=10],["7 gün seri",streak()>=7],["İlk set",m.done>=1],["Usta",m.mastered>=10]].map(([name,done])=>`<span class="badge ${done?"earned":""}">${done?"★":"☆"} ${name}</span>`).join("")}</div></section><section class="panel"><h3>Set başarıları</h3>${Array.from({length:8},(_,i)=>`<div class="listline"><span>Set ${i+1}</span><b>${state.exams['set'+(i+1)]?.best??'—'}${state.exams['set'+(i+1)]?.best!==undefined?'%':''}</b></div>`).join('')}</section>`)}
function profile(){const uncertain=['Kitap fotoğrafındaki silik yıldız izleri','El yazısı notlarda yıldız sayısı ve vurgular'];shell(`${title('PROFİL','Hesap ve ayarlar','Aynı sunucu adresinde PC ve iPhone üzerinden giriş yaparak ilerlemeni eşitle.')}<section class="panel account"><h3>Hesap eşitleme</h3>${account?`<p><b>${account}</b> · ${syncStatus}</p><button class="secondary" data-action="logout">Çıkış yap</button>`:`<p class="muted">${location.protocol==='file:'?'Çift tıklayarak açılan dosyada yerel kayıt çalışır. Hesap için uygulamayı eşitleme sunucusundan aç.':syncStatus}</p><label>Kullanıcı adı<input id="username" autocomplete="username" placeholder="Kullanıcı adı"></label><label>Şifre<input id="password" type="password" autocomplete="current-password" placeholder="En az 8 karakter"></label><div class="account-actions"><button class="primary" data-action="login">Giriş yap</button><button class="secondary" data-action="register">Hesap oluştur</button></div><p id="account-feedback" role="status"></p>`}</section><div class="two"><section class="panel"><h3>Haftalık hedef</h3><p>Çalışma günü hedefi</p><input type="number" id="goal" min="1" max="7" value="${state.settings.weeklyGoal||5}"><button class="secondary" data-action="save-goal">Kaydet</button></section><section class="panel"><h3>Veri yedeği</h3><button class="secondary" data-action="export">Yedeği indir</button><label class="file-label">Yedek yükle<input type="file" id="import" accept="application/json"></label></section></div><section class="panel"><h3>İçerik incelemesi</h3><p>${WORDS.length} sıfat, 8 set, 40 açıklamalı soru. Yıldız işaretleri fotoğrafta net görülenlerle sınırlı olarak işlendi.</p><p class="muted">Onay bekleyenler: ${uncertain.join('; ')}. Bir sonraki içerik güncellemesinde bu işaretler elle doğrulanmalı.</p></section><section class="panel"><h3>Kurs notlarından</h3><p>Edatlar: in, of, for, over, to, among, between, across, about, at, along, during, on, around, with.</p><p>İpuçları: sıfat çoğunlukla isimden önce gelir; “during” süreç/olay, “for” süre ile kullanılır. Bu notlar yeni sınav sorusu havuzuna eklenmeden ayrıca doğrulanacaktır.</p></section>`)}
function route(id){screen=id;if(id==='home')home();else if(id==='learn')learn();else if(id==='review')review();else if(id==='games')games();else if(id==='exams')exams();else if(id==='stats')stats();else if(id==='profile')profile()}
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(screen==='practice'&&Object.keys(b.dataset).some(k=>k.startsWith('practice'))){practiceSession.handle(b.dataset);return}if(b.dataset.nav)return route(b.dataset.nav);if(b.dataset.set)return openSet(Number(b.dataset.set));if(b.dataset.exam)return startExam(b.dataset.exam);if(b.dataset.rate)return nextCard(b.dataset.rate);if(b.dataset.choice&&session){const q=session.questions[session.index];if(session.chosen)return;session.chosen=b.dataset.choice;const good=session.chosen===q.answer;if(good)session.score++;record(byEn[q.answer].id,good,'exam');quiz();return}if(b.dataset.game)return startGame(b.dataset.game);if(b.dataset.syn){game.selected=game.selected.includes(b.dataset.syn)?game.selected.filter(x=>x!==b.dataset.syn):game.selected.length<2?[...game.selected,b.dataset.syn]:game.selected;synonymGame();return}if(b.dataset.flip){const i=Number(b.dataset.flip),p=game.pairs[i];if(game.flipped.includes(i)||game.matched.includes(p.key)||game.flipped.length>=2)return;game.flipped.push(i);memoryGame();if(game.flipped.length===2){const [a,z]=game.flipped.map(j=>game.pairs[j]);setTimeout(()=>{if(a.key===z.key){game.matched.push(a.key);game.score++;record(a.key,true,'memory')}else{record(a.key,false,'memory');record(z.key,false,'memory')}game.flipped=[];memoryGame()},650)}return}if(b.dataset.speed){const good=b.dataset.speed===game.current.en;game.score+=good?1:0;record(game.current.id,good,'speed');gameNext(10);return}if(['login','register','logout'].includes(b.dataset.action)){try{if(location.protocol==='file:')throw Error('Hesap için sunucu adresinden açmalısın.');if(b.dataset.action==='logout')await logout();else{const username=document.querySelector('#username').value.trim(),password=document.querySelector('#password').value;await (b.dataset.action==='register'?register:login)(username,password)}profile()}catch(err){const feedback=document.querySelector('#account-feedback');if(feedback)feedback.textContent=err.message}return}switch(b.dataset.action){case 'speak':{const w=screen==='reviewcard'?reviewQueue[cardIndex]:WORDS.filter(x=>x.set===learnSet)[cardIndex];if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';speechSynthesis.speak(u)}break}case 'example':exampleIndex++;card(screen==='reviewcard'?reviewQueue:WORDS.filter(w=>w.set===learnSet),screen==='reviewcard'?'review':'learn');break;case 'reveal':showMeaning=true;card(screen==='reviewcard'?reviewQueue:WORDS.filter(w=>w.set===learnSet),screen==='reviewcard'?'review':'learn');break;case 'start-review':startReview();break;case 'next-question':session.index++;session.chosen=null;if(session.index>=session.questions.length)finishExam();else quiz();break;case 'check-syn':{const good=game.selected.length===2&&game.selected.every(x=>game.current.correct.includes(x));game.score+=good?1:0;record(game.current.w.id,good,'syn');gameNext(5);break}case 'check-recall':{const value=document.querySelector('#recall').value.trim().toLowerCase(),good=value===game.current.en;game.score+=good?1:0;record(game.current.id,good,'recall');document.querySelector('#feedback').innerHTML=`<p>${good?'Doğru!':'Doğru kelime: '+game.current.en}</p><button class="secondary" data-action="next-game">Devam →</button>`;b.disabled=true;break}case 'next-game':gameNext(5);break;case 'restart-game':game.pairs=[];game.matched=[];game.flipped=[];game.score=0;memoryGame();break;case 'save-goal':state.settings.weeklyGoal=Math.max(1,Math.min(7,Number(document.querySelector('#goal').value)||5));save();profile();break;case 'export':{const blob=new Blob([exportProgress()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ydsem-yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break}}});
app.addEventListener('change',async e=>{if(e.target.id==='import'){try{const raw=await e.target.files[0].text();importProgress(raw);alert('Yedek yüklendi.');profile()}catch(err){alert(err.message)}}if(e.target.id==='timed'){game.limit=e.target.checked?15:0;if(game.timer)clearTimeout(game.timer);game.timer=null;if(game.limit)game.timer=setTimeout(()=>{if(screen==='game'&&game.id==='speed'){record(game.current.id,false,'speed');gameNext(10)}},15000)}});
app.addEventListener('input',e=>{if(e.target.id==='practice-answer'&&screen==='practice')practiceSession.input(e.target.value)});
app.addEventListener('keydown',e=>{if(e.target.id==='practice-answer'&&e.key==='Enter'&&screen==='practice'){e.preventDefault();practiceSession.handle({practiceAction:'check'})}});
if(typeof window!=='undefined'&&window.visualViewport){const fitPractice=()=>{document.documentElement.style.setProperty('--practice-height',`${window.visualViewport.height}px`);document.documentElement.style.setProperty('--practice-top',`${window.visualViewport.offsetTop}px`)};window.visualViewport.addEventListener('resize',fitPractice);window.visualViewport.addEventListener('scroll',fitPractice);fitPractice()}
if(validateQuestions().length)console.error('Question bank conflicts',validateQuestions());route('home');if(typeof window!=='undefined')setInterval(()=>{if(document.visibilityState==='visible')addStudyMinute()},60000);initSync().then(()=>{if(screen==='profile')profile()});if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js');





</script></body></html>
